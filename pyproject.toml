[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "video-splitter"
version = "0.2.1"
description = "A CLI tool to split videos into individual frames"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Mike Horrocks", email = "mikeh_74_@outlook.com"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "opencv-python>=4.5.0",
]

[project.scripts]
video-splitter = "splitter_cli.video_splitter:main"

[project.urls]
Homepage = "https://github.com/mikeh74/video_splitter"
Repository = "https://github.com/mikeh74/video_splitter.git"